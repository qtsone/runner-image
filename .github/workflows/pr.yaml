name: PR Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'

jobs:
  pr-checks:
    # Deliberately not arc-*: this workflow builds the very image those runners run on,
    # so keeping it on a hosted runner avoids a bad build being unable to fix itself.
    # The repository.private guard also keeps public repos off arc-* entirely: the org
    # runner group rejects them, so their jobs would queue forever instead of falling back.
    runs-on: ${{ vars.GHA_RUNNER_OVERRIDE || (github.event.repository.private && github.event.repository.custom_properties.GHA_RUNNER_TYPE == 'PRIVATE' && format('arc-{0}', github.event.repository.custom_properties.GHA_RUNNER_SIZE) || 'ubuntu-latest') }}
    environment: pr-checks
    permissions:
      contents: read
      pull-requests: write
      packages: write
    steps:
    # docker/tests has no checkout of its own (unlike docker/build), so the workspace is
    # empty unless we check out first — hadolint and buildx would both fail with
    # "docker/Dockerfile: does not exist".
    - name: Checkout
      uses: actions/checkout@v4
    - name: Docker Tests
      uses: qtsone/actions/docker/tests@main
      with:
        image-name: qtsone/runner
        dockerfile-path: docker/Dockerfile
        github-token: ${{ secrets.GITHUB_TOKEN }}
