name: PR Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'

jobs:
  pr-checks:
    # Hosted, never arc-*: this workflow builds the very image those runners run on,
    # so a bad build must not need a working self-hosted runner to fix itself.
    runs-on: ubuntu-latest
    environment: pr-checks
    permissions:
      contents: read
      pull-requests: write
      packages: write
    steps:
    # docker/tests has no checkout of its own (unlike docker/build), so the workspace is
    # empty unless we check out first — hadolint and buildx would both fail with
    # "docker/Dockerfile: does not exist".
    - name: Checkout
      uses: actions/checkout@v7
    - name: Docker Tests
      uses: qtsone/actions/docker/tests@main
      with:
        image-name: qtsone/runner
        dockerfile-path: docker/Dockerfile
        github-token: ${{ secrets.GITHUB_TOKEN }}
